[project]
name = "marketcanvas"
version = "0.1.0"
description = "2D canvas RL environment for design agents"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.0.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "mcp[cli]>=1.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
